name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --no-restore

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      API_PORT: ${{ vars.API_PORT || '18080' }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY GH_TOKEN; do
            [[ -n "${!key}" ]] || { echo "Missing $key" >&2; exit 1; }
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$API_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/credit_deploy
          chmod 600 ~/.ssh/credit_deploy
      - name: Log in to GHCR on VPS
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GHCR_USERNAME" =~ ^[a-zA-Z0-9-]+$ ]] || exit 1
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/credit_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/credit_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'mkdir -p ~/credit-app/database'
          scp -i ~/.ssh/credit_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new deploy/compose.production.yml deploy/deploy.sh "$SSH_USER@$SSH_HOST:credit-app/"
          scp -i ~/.ssh/credit_deploy -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new database/credit_application.sql database/add_users.sql "$SSH_USER@$SSH_HOST:credit-app/database/"
      - name: Deploy
        shell: bash
        run: ssh -i ~/.ssh/credit_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "bash ~/credit-app/deploy.sh '$IMAGE' '$API_PORT'"
